<style>
  :root {
    color-scheme: dark;
    --bg: #16131d; --surface: #221e2c; --surface-2: #2d2839; --line: #3a3448;
    --ink: #f5f1e8; --muted: #a7a1b5; --accent: #ffcf3f; --accent-ink: #1e1a10;
    --good: #52d18f; --bad: #ff7a6b; --bubble: #f5f1e8; --bubble-ink: #1b1824;
    --display: 'Bricolage Grotesque', system-ui, sans-serif;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; overscroll-behavior-y: none; }   /* pas de « tirer pour recharger » en pleine partie */
  body {
    margin: 0; min-height: 100dvh; background: var(--bg); color: var(--ink); overscroll-behavior-y: none;
    font: 16px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px; margin: 0 auto; min-height: 100dvh;
    padding: max(16px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 14px;
    overflow-x: clip;   /* confettis et animations ne font pas glisser la page sur le côté */
  }
  h1, h2 { font-family: var(--display); margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 19px; margin-top: 8px; display: flex; align-items: baseline; gap: 8px; }
  h2 small { color: var(--muted); font: 600 14px system-ui, sans-serif; }
  p { margin: 0; }
  small { color: var(--muted); }

  button, .button {
    font: 600 16px/1.2 system-ui, sans-serif; color: var(--ink); background: var(--surface-2);
    border: 1px solid var(--line); border-radius: 12px; padding: 13px 16px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
    transition: transform .08s, background .15s, border-color .15s;
  }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { cursor: default; opacity: .45; }
  .primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .primary:disabled { opacity: .35; }
  .big { width: 100%; padding: 17px; font-size: 18px; }
  .small { padding: 8px 12px; font-size: 14px; }
  .link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 8px; font-weight: 500; }
  input[type=file] { display: none; }
  .home-logo { align-self: flex-start; background: none; border: 0; padding: 4px 0; font: 800 22px/1 var(--display); color: var(--ink); gap: 0; }
  .home-logo span { background: var(--accent); color: var(--accent-ink); padding: 0 .16em; margin: 0 .18em; border-radius: .2em; display: inline-block; transform: rotate(-3deg); }
  .host { position: relative; }
  .host .hint { position: absolute; top: 100%; left: 0; right: 0; margin-top: 8px; font-size: 14px; }   /* hors du flux : le bouton seul est centré */
  .privacy-badge {
    width: 100%; justify-content: space-between; text-align: center; gap: 6px; padding: 12px 10px; font-size: 15px;
    background: rgba(82, 209, 143, .12); border-color: rgba(82, 209, 143, .45);
  }
  .privacy-badge svg { width: 22px; height: 22px; flex: none; color: var(--good); }
  .privacy-badge span { display: flex; flex-direction: column; align-items: center; gap: 2px; flex: 1; }
  .privacy-badge b { font: 700 16px/1.25 var(--display); }
  .privacy-badge small { color: var(--muted); font-size: 14px; font-weight: 500; }
  .privacy-badge u { color: var(--good); text-underline-offset: 3px; margin-left: 2px; }
  .how { display: flex; flex-direction: column; gap: 10px; }
  .how-label { text-align: center; color: var(--ink); font-weight: 600; font-size: 15px; }
  .lang-switch { align-self: center; display: flex; border: 1px solid var(--line); border-radius: 99px; padding: 2px; z-index: 1; }
  .lang-switch button { padding: 4px 10px; font-size: 12px; font-weight: 700; border: 0; border-radius: 99px; background: none; color: var(--muted); }
  .lang-switch button[aria-pressed="true"] { background: var(--surface-2); color: var(--ink); }
  .home-top .lang-switch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); }
  .how-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .how-buttons button svg { width: 20px; height: 20px; }
  .how-buttons .os-apple { color: var(--ink); margin-top: -3px; }
  .how-buttons .os-android { color: #3ddc84; }
  .howto-video { display: block; aspect-ratio: 9 / 16; height: min(60vh, 560px); max-width: 100%; margin: 14px auto 0; border-radius: 22px; background: var(--surface); object-fit: cover; }
  .howto-steps { margin: 18px 0 0; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; font-size: 16px; }
  .howto-steps li::marker { color: var(--accent); font-weight: 800; }
  .howto-tip { color: var(--muted); font-size: 14px; margin-top: 14px; }
  /* Accueil sur un écran : « Lancer une partie » au milieu, le titre au-dessus, l'aide en dessous. */
  .home { flex: 1; display: grid; grid-template-rows: 1fr auto 1fr; gap: 20px; margin-bottom: -12px; }
  .home-top { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .home-bottom { display: flex; flex-direction: column; gap: 20px; padding-top: 18px; }
  .home-bottom .how { margin-top: auto; }   /* juste au-dessus du bas de page */
  .join-qr { align-items: center; text-align: center; }
  .join-qr .qr { width: min(260px, 68vw); padding: 10px; border-radius: 16px; }
  .sheet-top { display: flex; align-items: center; gap: 6px; padding-top: 6px; }
  .sheet-top h1 { font-size: 30px; }
  .back { background: none; border: 0; padding: 6px; margin-left: -8px; }
  .back svg { width: 26px; height: 26px; }
  .privacy-points { list-style: none; padding: 0; margin: 10px 0 0; display: flex; flex-direction: column; gap: 20px; }
  .privacy-points li { display: flex; gap: 14px; align-items: flex-start; }
  .privacy-points svg { width: 30px; height: 30px; flex: none; color: var(--good); margin-top: 2px; }
  .privacy-points b { display: block; font: 700 17px/1.3 var(--display); }
  .privacy-points p { color: var(--muted); font-size: 15px; margin-top: 4px; }
  .privacy-more { text-align: center; color: var(--muted); padding: 8px; text-underline-offset: 3px; }
  .foot { display: flex; justify-content: center; gap: 22px; flex-wrap: wrap; padding: 10px 0 4px; font-size: 15px; }
  .foot a { color: var(--muted); text-decoration: none; font-weight: 600; }
  .foot a:hover, .foot .link:hover { color: var(--ink); }
  .foot .link { padding: 0; font-size: 15px; font-weight: 600; text-decoration: none; color: var(--muted); }

  .brand { text-align: center; padding: 44px 0 0; }
  .brand h1 { font-size: 46px; line-height: 1; font-weight: 800; }
  .brand h1 span {
    background: var(--accent); color: var(--accent-ink); padding: 0 .16em; border-radius: .2em;
    display: inline-block; transform: rotate(-3deg);
  }
  .brand p { color: var(--muted); margin-top: 12px; }
  .brand p b { color: var(--ink); font-weight: 600; }
  .brand .counter { display: inline-block; margin-top: 10px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 99px; font-size: 14px; }
  .brand .counter svg { width: 15px; height: 15px; margin-right: 6px; vertical-align: -2px; color: var(--muted); }
  .brand .counter .flaps { display: inline-flex; gap: 2px; vertical-align: -1px; font: 700 14px/1 var(--display); color: var(--accent); font-variant-numeric: tabular-nums; }
  .flap { position: relative; display: inline-block; width: 1.05em; padding: 3px 0; text-align: center; background: #0d0b12; border-radius: 3px; overflow: hidden; }
  .flap::after { content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: rgba(22, 19, 29, .9); }
  .flap.flip { animation: flip .07s ease-out; }
  @keyframes flip { from { transform: scaleY(.25); } to { transform: none; } }
  .flaps .sep { width: .2em; }
  .brand.small { padding: 10px 0 0; }
  .brand.small h1 { font-size: 34px; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: flex; flex-direction: column; gap: 12px; }
  .card h2 { margin: 0; }
  .card p { color: var(--muted); font-size: 15px; }
  .join { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .join input {
    min-width: 0; font: 600 18px system-ui, sans-serif; text-align: center;
    background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 8px;
  }
  .join input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .notice { background: rgba(82, 209, 143, .12); border: 1px solid var(--good); color: var(--ink); padding: 12px 14px; border-radius: 12px; }
  .share-game { width: 100%; margin-top: 4px; }
  .error { background: rgba(255, 122, 107, .12); border: 1px solid var(--bad); color: #ffd2cc; padding: 12px 14px; border-radius: 12px; }

  .busy { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: var(--muted); }
  .spinner { width: 42px; height: 42px; border-radius: 50%; border: 4px solid var(--surface-2); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .banner { position: sticky; top: 0; z-index: 2; background: var(--bad); color: #1b0f0d; font-weight: 600; text-align: center; padding: 8px; border-radius: 10px; }

  .top .title { color: var(--muted); font-size: 15px; }
  .group { display: flex; align-items: center; gap: 10px; font: 800 20px/1.2 var(--display); min-width: 0; }
  .group b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .group svg { width: 22px; height: 22px; flex: none; color: var(--muted); }
  .group .media-ic { display: inline-flex; flex: none; }
  .group .media-ic svg { color: var(--good); }
  .group .media-ic.off svg { color: var(--muted); opacity: .7; }
  .qr { width: min(120px, 30vw); flex: none; background: #fff; border-radius: 10px; padding: 4px; line-height: 0; }
  .qr svg { width: 100%; height: auto; }

  .knock { border-color: var(--accent); }
  .knock .ask { display: flex; align-items: center; gap: 8px; }
  .knock .ask span { flex: 1; min-width: 0; font-weight: 700; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .members { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .members button { flex-direction: column; align-items: flex-start; text-align: left; gap: 2px; padding: 11px 12px; min-width: 0; }
  .members button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .members button small { font-weight: 500; font-size: 12px; }
  .members button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .members button.on small { color: rgba(30, 26, 16, .7); }
  .members button[hidden], .more-members[hidden] { display: none; }
  .member-search {
    width: 100%; font: 500 17px system-ui, sans-serif; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
  }
  .member-search:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .more-members { align-self: center; font-size: 15px; }
  .me-pick { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--surface); border: 1px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-size: 17px; }
  .me-pick b { color: var(--accent); }
  .me-pick .link { padding: 4px; font-size: 15px; }
  .outside-link { align-self: center; flex-direction: column; gap: 2px; font-size: 15px; text-decoration: none; }
  .outside-link u { text-underline-offset: 3px; }
  .outside-link small { font-size: 13px; }
  .outside-form + .hint { font-size: 14px; margin-top: -4px; }

  .players { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .players li { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 12px; padding: 10px 14px; }
  .players li.off { opacity: .5; }
  .players .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; font-size: 12px; }

  .setting { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .setting > span { color: var(--muted); font-size: 15px; }
  .seg { display: flex; background: var(--surface); border-radius: 12px; padding: 3px; }
  .seg button { background: none; border: 0; padding: 8px 12px; font-size: 15px; border-radius: 9px; color: var(--muted); }
  .seg button.on { background: var(--surface-2); color: var(--ink); }
  .toggle input { width: 22px; height: 22px; accent-color: var(--accent); }
  .actions { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  .hint, .wait, .voters { text-align: center; color: var(--muted); font-size: 15px; }
  .wait { margin-top: 12px; }

  .hud { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-weight: 600; }
  .timer { font: 800 28px var(--display); color: var(--ink); min-width: 2ch; text-align: right; }
  .timer.hurry { color: var(--bad); }
  .bar { height: 6px; background: var(--surface); border-radius: 99px; overflow: hidden; margin-top: -6px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 100%; transition: width .2s linear; }
  .ask { font: 600 20px var(--display); text-align: center; margin-top: 10px; color: var(--muted); }

  .bubble {
    position: relative; align-self: center; max-width: 100%; background: var(--bubble); color: var(--bubble-ink);
    font: 800 34px/1.15 var(--display); padding: 22px 26px; border-radius: 26px 26px 26px 0;
    text-align: center; overflow-wrap: anywhere; margin: 6px 0 12px; box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    animation: pop .35s cubic-bezier(.2, 1.4, .4, 1);
  }
  .bubble::after { content: ''; position: absolute; left: 0; top: calc(100% - 1px); width: 22px; height: 15px; background: inherit; clip-path: polygon(0 0, 100% 0, 0 100%); }   /* pointe, de la couleur de la bulle */
  .bubble.emoji { font-size: 76px; line-height: 1; padding: 18px 30px; }
  .bubble.ponct { font-size: 64px; letter-spacing: .05em; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } }
  .bubble.media { padding: 12px; line-height: 0; min-width: 160px; min-height: 120px; display: flex; align-items: center; justify-content: center; }
  .bubble.media img, .bubble.media video { max-width: 100%; max-height: 38vh; border-radius: 16px; display: block; }
  .bubble.sticker, .bubble.gif { background: var(--surface-2); }
  .bubble.media .wait { font: 600 15px/1.4 system-ui, sans-serif; color: var(--muted); }
  .bubble.habitude { font-size: 40px; }
  .bubble.record { font-size: 30px; }
  .bubble.message { font: 600 21px/1.4 system-ui, -apple-system, sans-serif; text-align: left; white-space: pre-wrap; padding: 18px 20px; }
  .slideshow { position: relative; height: min(60vh, 520px); border-radius: 20px; overflow: hidden; background: var(--surface); display: flex; align-items: center; justify-content: center; }
  .slide { position: absolute; inset: 0; margin: 0; animation: fade .7s ease-out; }
  .slide img { width: 100%; height: 100%; object-fit: cover; animation: kenburns 4.2s ease-out forwards; }
  .slide figcaption { position: absolute; left: 12px; top: 12px; background: rgba(22, 19, 29, .72); color: var(--ink); font-size: 14px; font-weight: 600; padding: 5px 10px; border-radius: 99px; }
  .reacts { position: absolute; left: 0; right: 0; bottom: 14px; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 0 12px; }
  .reacts span { font-size: 34px; line-height: 1; background: rgba(22, 19, 29, .62); border-radius: 99px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 4px;
    opacity: 0; animation: react .6s cubic-bezier(.2, 1.5, .4, 1) forwards, bob 2.4s ease-in-out infinite; animation-delay: calc(.5s + var(--i) * .18s), calc(1.1s + var(--i) * .18s); }
  .reacts small { font: 700 13px system-ui, sans-serif; color: var(--ink); }
  @keyframes fade { from { opacity: 0; } }
  @keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.12) translate(-2%, -2%); } }
  @keyframes react { from { opacity: 0; transform: translateY(24px) scale(.4); } to { opacity: 1; transform: none; } }
  @keyframes bob { 50% { transform: translateY(-5px); } }

  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .options button { flex-direction: column; gap: 6px; padding: 14px 10px; font-size: 17px; min-height: 76px; overflow-wrap: anywhere; }
  .options button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); opacity: 1; }
  .options:has(button:nth-child(5)) button { padding: 12px 8px; min-height: 64px; font-size: 16px; }
  .round-top { display: flex; align-items: flex-start; gap: 14px; }
  .round-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .round-info .bar { margin-top: 0; }
  .vote-count { flex: none; display: grid; grid-template-columns: auto auto; align-items: baseline; justify-content: center; padding: 6px 12px; background: var(--surface); border-radius: 12px; text-align: center; }
  .vote-count b { font: 800 26px/1 var(--display); color: var(--accent); }
  .vote-count span { font: 700 16px/1 var(--display); color: var(--muted); }
  .vote-count small { grid-column: 1 / -1; font-size: 12px; margin-top: 2px; }
  .vote-count.all b { color: var(--good); }
  /* Le bouton de l'hôte reste en bas de l'écran, même quand la liste des votes est longue. */
  .sticky-next { position: sticky; bottom: 0; margin: 0 -16px calc(-1 * max(28px, env(safe-area-inset-bottom))); padding: 14px 16px max(16px, env(safe-area-inset-bottom)); background: linear-gradient(to bottom, transparent, var(--bg) 35%); z-index: 2; }

  .answer { font: 800 30px/1.15 var(--display); text-align: center; animation: pop .4s cubic-bezier(.2, 1.4, .4, 1); }
  .answer b { color: var(--accent); }
  .stat { text-align: center; color: var(--muted); }
  .stat b { color: var(--ink); }
  .example { margin: 0; align-self: flex-start; max-width: 90%; background: var(--surface-2); border-radius: 4px 16px 16px 16px; padding: 8px 12px 10px; }
  .example figcaption { font-size: 13px; font-weight: 700; color: var(--accent); margin-bottom: 2px; }
  .example p { white-space: pre-wrap; overflow-wrap: anywhere; }
  .example mark { background: rgba(255, 207, 63, .3); color: inherit; border-radius: 4px; padding: 0 2px; }
  .fun { text-align: center; font-weight: 700; color: var(--bad); }

  .votes { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .votes li { display: grid; grid-template-columns: 1fr 1fr 4.2em; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--surface); }
  .votes li.off { opacity: .5; }
  .votes li > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .votes .head { background: none; padding: 0 14px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .votes .head span:last-child { text-align: right; }
  .votes .vote { color: var(--muted); }
