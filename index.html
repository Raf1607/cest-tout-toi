<style>
  :root {

  .slide { position: absolute; inset: 0; margin: 0; animation: fade .7s ease-out; }

  .reacts span { font-size: 34px; line-height: 1; background: rgba(22, 19, 29, .62); border-radius: 99px; padding: 6px 10px; display: inline-flex; align-items: center; gap: 4px;
    opacity: 0; animation: react .6s cubic-bezier(.2, 1.5, .4, 1) forwards, bob 2.4s ease-in-out infinite; animation-delay: calc(.5s + var(--i) * .18s), calc(1.1s + var(--i) * .18s); }

  .votes { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .votes li { display: grid; grid-template-columns: 1fr 1fr 4.2em; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; background: var(--surface); }
  .votes li.off { opacity: .5; }
  .votes li > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .votes .head { background: none; padding: 0 14px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .votes .head span:last-child { text-align: right; }

  .edit { position: fixed; inset: 0; z-index: 20; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .edit-skip { position: fixed; z-index: 21; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); color: #fff; }
  .edit-frame { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .edit-frame img, .edit-frame video { width: 100%; height: 100%; object-fit: contain; }
  .edit-text { color: #fff; text-align: center; padding: 0 22px; font-family: var(--display); font-weight: 800; }
  .edit-text.big { font-size: clamp(38px, 12vw, 64px); line-height: 1.05; text-transform: uppercase; }
  .edit-text.quote { font-size: 26px; line-height: 1.25; color: var(--accent); }
  .edit-frame.punch > * { animation: editPunch .32s cubic-bezier(.1, 1.4, .3, 1); }
  .edit-frame.shake > * { animation: editShake .3s linear; }
  .edit-frame.flash { animation: editFlash .24s ease-out; }
  .edit-frame.glitch > * { animation: editGlitch .34s steps(5); }
  .edit-frame.noir > * { filter: grayscale(1) contrast(1.5); animation: editPunch .3s ease-out; }
  .edit-frame.tilt > * { animation: editTilt .36s cubic-bezier(.1, 1.3, .3, 1); }
  .edit-frame.slide > * { animation: editSlide .26s cubic-bezier(.1, 1, .3, 1); }
  @keyframes editPunch { from { transform: scale(1.45); } }
  @keyframes editShake { 20% { transform: translate(-12px, 7px) rotate(-1.5deg); } 40% { transform: translate(11px, -8px) rotate(1.5deg); } 60% { transform: translate(-8px, -5px); } 80% { transform: translate(6px, 5px); } }
  @keyframes editFlash { from { background: #fff; } }
  @keyframes editGlitch { 0% { filter: drop-shadow(10px 0 #f0f) drop-shadow(-10px 0 #0ff); transform: translateX(10px); } 50% { filter: drop-shadow(-7px 0 #f0f) drop-shadow(7px 0 #0ff); transform: translateX(-8px) scale(1.06); } }
  @keyframes editTilt { from { transform: rotate(-9deg) scale(1.35); } }
  @keyframes editSlide { from { transform: translateX(100%); } }
  .bubble { transition: filter .3s; }
  .bubble.blurred { filter: blur(11px); }
  .fx { text-align: center; font-size: 14px; font-weight: 700; padding: 6px 10px; border-radius: 10px; }
  .fx.good { background: rgba(82, 209, 143, .15); color: var(--good); }
  .fx.bad { background: rgba(255, 122, 107, .15); color: var(--bad); }
  .wheel-box { position: relative; width: min(84vw, 340px); aspect-ratio: 1; margin: 26px auto 18px; }
  .pointer { position: absolute; top: -8px; left: 50%; margin-left: -15px; z-index: 4; width: 0; height: 0; border: 15px solid transparent; border-top: 28px solid var(--accent); border-bottom: 0; filter: drop-shadow(0 3px 4px rgba(0, 0, 0, .6)); transform-origin: top center; }
  .wheel-box.spinning .pointer { animation: tick .13s ease-in-out infinite alternate; }
  .wheel-box.done .pointer { animation: tick .3s ease-out 2 alternate; }
  .lights { position: absolute; inset: -12px; border-radius: 50%; background: #2a2437; box-shadow: 0 0 34px rgba(255, 207, 63, .28), inset 0 0 0 2px var(--accent); }
  .lights i { position: absolute; top: 50%; left: 50%; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: var(--accent); transform: rotate(var(--a)) translateY(calc(min(42vw, 170px) + 6px)); animation: blink .5s steps(2) infinite; animation-delay: calc(var(--n) * .25s); box-shadow: 0 0 8px var(--accent); }
  .wheel-box.spinning .lights i { animation-duration: .18s; animation-delay: calc(var(--n) * .09s); }
  .spot { position: absolute; inset: 0; border-radius: 50%; z-index: 2; opacity: 0; pointer-events: none; background: conic-gradient(from -30deg, rgba(255, 255, 255, .28) 0 60deg, rgba(10, 8, 16, .62) 60deg 360deg); transition: opacity .35s; }
  .wheel-box.done .spot { opacity: 1; animation: spotPulse .7s ease-in-out infinite alternate; }
  .hub { position: absolute; top: 50%; left: 50%; width: 19%; height: 19%; translate: -50% -50%; z-index: 3; border-radius: 50%; background: #2a2437; border: 4px solid var(--accent); box-shadow: 0 2px 10px rgba(0, 0, 0, .55); }
  .wheel-box.spinning .hub { animation: hubGlow .4s ease-in-out infinite alternate; }
  .wheel-box.bonus .lights { box-shadow: 0 0 50px rgba(82, 209, 143, .75), inset 0 0 0 2px var(--good); }
  .wheel-box.malus .lights { box-shadow: 0 0 50px rgba(255, 122, 107, .8), inset 0 0 0 2px var(--bad); }
  .wheel-box.malus { animation: wheelShake .45s ease-in-out; }
  .wheel-box s { position: absolute; width: 8px; height: 12px; border-radius: 2px; z-index: 5; pointer-events: none; opacity: 0; animation: confetti 1s ease-out forwards; }
  @keyframes tick { from { rotate: -9deg; } to { rotate: 9deg; } }
  @keyframes blink { 50% { opacity: .22; } }
  @keyframes spotPulse { to { filter: brightness(1.35); } }
  @keyframes hubGlow { to { box-shadow: 0 0 22px var(--accent); } }
  @keyframes wheelShake { 20% { translate: -9px 0; } 40% { translate: 8px 0; } 60% { translate: -6px 0; } 80% { translate: 4px 0; } }
  .wheel { position: absolute; inset: 0; border-radius: 50%; border: 4px solid #1b1824; overflow: hidden; box-shadow: inset 0 0 26px rgba(0, 0, 0, .4); transition: transform 3.8s cubic-bezier(.12, .72, .1, 1);
    --bonus: #2f9e6e; --bonus-2: #47b985; --malus: #d9503f; --malus-2: #ee6f5e; }
  .wheel span { position: absolute; top: 0; left: 50%; height: 50%; width: 80px; margin-left: -40px; transform-origin: bottom center; display: flex; justify-content: center; padding-top: 14px; }
  .wheel b { color: #fff; font: 800 13px/1.15 var(--display); text-align: center; }

  .wheel-result.show { opacity: 1; transform: none; text-shadow: 0 0 18px currentColor; }
  .wheel-result.bonus { color: var(--good); }
  .wheel-result.malus { color: var(--bad); }
  .board { list-style: none; margin: 8px 0 0; padding: 0; position: relative; }
  .board li { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px; background: var(--surface); border-radius: 14px; font-size: 17px; overflow: hidden;
    transition: transform .85s cubic-bezier(.3, 1.35, .5, 1), scale .4s ease-out, background .4s;
    animation: boardIn .3s ease-out backwards; animation-delay: calc(var(--i) * 50ms); }
  .board.scored li.gain { animation: glowGain .7s ease-out; }
  .board.scored li.loss { animation: shake .4s ease-in-out; }
  .board.moving li.rise { scale: 1.04; box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
  .board li.lead { background: linear-gradient(100deg, #ffcf3f, #ffe48a); color: var(--accent-ink); scale: 1; }
  .board li.lead em, .board li.lead b, .board li.lead .name { color: var(--accent-ink); }
  .board li.lead::after { content: ''; position: absolute; top: 0; bottom: 0; width: 40%; left: -50%; background: linear-gradient(100deg, transparent, rgba(255, 255, 255, .75), transparent); animation: sheen .8s ease-out forwards; }
  .board.scored b { animation: bump .45s cubic-bezier(.2, 1.8, .4, 1); }
  .board s { position: absolute; top: 20px; width: 8px; height: 12px; border-radius: 2px; z-index: 3; pointer-events: none; opacity: 0; animation: confetti 1s ease-out forwards; }
  @keyframes boardIn { from { opacity: 0; translate: 40px 0; } }
  @keyframes glowGain { 0%, 100% { box-shadow: 0 0 0 0 rgba(82, 209, 143, 0); } 35% { box-shadow: 0 0 22px 3px rgba(82, 209, 143, .75); } }
  @keyframes shake { 25% { translate: -6px 0; } 50% { translate: 5px 0; } 75% { translate: -3px 0; } }
